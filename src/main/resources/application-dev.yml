spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:nl2sql}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration

# 通义千问（DashScope OpenAI 兼容端点），M1 用 qwen-turbo
nl2sql:
  llm:
    base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${DASHSCOPE_API_KEY:}
    model: ${DASHSCOPE_MODEL:qwen-turbo}
    timeout-seconds: 30              # NFR-2
  jwt:
    secret: ${JWT_SECRET:}
    expiration-hours: 24             # ADR D-11
